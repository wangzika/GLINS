# rtkpost options (2023/04/16 14:48:45, v.demo5 b34g)
# RTKLIB 后处理配置文件，下面按功能分组补充中文说明。

# -------------------- 定位基础选项 --------------------
pos1-posmode       =kinematic  # (0:single,1:dgps,2:kinematic,3:static,4:static-start,5:movingbase,6:fixed,7:ppp-kine,8:ppp-static,9:ppp-fixed) 定位模式，这里是动态相对定位
pos1-frequency     =l1+l2+l5   # (1:l1,2:l1+l2,3:l1+l2+l5,4:l1+l2+l5+l6) 使用的频点组合，这里启用 L1/L2/L5
pos1-soltype       =forward    # (0:forward,1:backward,2:combined,3:combined-nophasereset) 解算方向，这里是前向解
pos1-elmask        =10         # (deg) 截止高度角，小于 10 度的卫星不参与解算
pos1-snrmask_r     =on         # (0:off,1:on) 启用流动站信噪比掩码
pos1-snrmask_b     =off        # (0:off,1:on) 不启用基站信噪比掩码
pos1-snrmask_L1    =20,20,20,20,20,20,20,20,20 # L1 频点各高度角区间的 SNR 掩码阈值
pos1-snrmask_L2    =34,34,34,34,34,34,34,34,34 # L2 频点各高度角区间的 SNR 掩码阈值
pos1-snrmask_L5    =10,10,10,10,10,10,10,10,10 # L5 频点各高度角区间的 SNR 掩码阈值
pos1-dynamics      =off        # (0:off,1:on) 是否启用动态模型，这里关闭
pos1-tidecorr      =off        # (0:off,1:on,2:otl) 是否进行潮汐改正，这里关闭
pos1-ionoopt       =brdc       # (0:off,1:brdc,2:sbas,3:dual-freq,4:est-stec,5:ionex-tec,6:qzs-brdc) 电离层改正方式，使用广播模型
pos1-tropopt       =saas       # (0:off,1:saas,2:sbas,3:est-ztd,4:est-ztdgrad) 对流层改正方式，使用 Saastamoinen 模型
pos1-sateph        =brdc       # (0:brdc,1:precise,2:brdc+sbas,3:brdc+ssrapc,4:brdc+ssrcom) 星历类型，使用广播星历
pos1-posopt1       =off        # (0:off,1:on) 定位附加选项 1，关闭
pos1-posopt2       =off        # (0:off,1:on) 定位附加选项 2，关闭
pos1-posopt3       =off        # (0:off,1:on,2:precise) 定位附加选项 3，关闭
pos1-posopt4       =off        # (0:off,1:on) 定位附加选项 4，关闭
pos1-posopt5       =on         # (0:off,1:on) 定位附加选项 5，开启
pos1-posopt6       =off        # (0:off,1:on) 定位附加选项 6，关闭
pos1-exclsats      =C01 C02 C03 C04 C05 C33# (prn ...) 排除参与解算的卫星 PRN 列表
pos1-navsys        =41         # (1:gps+2:sbas+4:glo+8:gal+16:qzs+32:bds+64:navic) 启用 GPS + BDS + QZSS
pos1-robustopt     =3          # 鲁棒估计选项编号
pos1-k0            =1.5        # 鲁棒估计参数 k0
pos1-k1            =3          # 鲁棒估计参数 k1

# -------------------- 模糊度固定与质量控制 --------------------
pos2-armode        =3          # (0:off,1:continuous,2:instantaneous,3:fix-and-hold) 整周模糊度固定模式，使用 fix-and-hold
pos2-gloarmode     =off        # (0:off,1:on,2:autocal,3:fix-and-hold) GLONASS 模糊度固定关闭
pos2-bdsarmode     =on         # (0:off,1:on) BDS 模糊度固定开启
pos2-arfilter      =on         # (0:off,1:on) 启用模糊度固定过滤
pos2-arthres       =3          # 模糊度固定主阈值
pos2-arthresmin    =3          # 模糊度固定最小阈值
pos2-arthresmax    =3          # 模糊度固定最大阈值
pos2-arthres1      =1          # 模糊度固定附加阈值 1
pos2-arthres2      =0          # 模糊度固定附加阈值 2
pos2-arthres3      =1e-09      # 模糊度固定附加阈值 3
pos2-arthres4      =1e-05      # 模糊度固定附加阈值 4
pos2-varholdamb    =0.1        # (cyc^2) hold 模式下模糊度过程噪声方差
pos2-gainholdamb   =0.01       # hold 模式下模糊度增益
pos2-arlockcnt     =5          # 周跳后重新参与固定前的锁定历元数
pos2-minfixsats    =4          # 进行固定所需的最少卫星数
pos2-minholdsats   =5          # 保持固定所需的最少卫星数
pos2-mindropsats   =10         # 触发降级判断的最少卫星数阈值
pos2-arelmask      =15         # (deg) 模糊度固定使用的截止高度角
pos2-arminfix      =10         # 输出固定解前需要连续固定的最少次数
pos2-armaxiter     =1          # 每历元模糊度固定最大迭代次数
pos2-elmaskhold    =15         # (deg) hold 模式使用的截止高度角
pos2-aroutcnt      =1          # 固定失败后允许的外推次数
pos2-maxage        =1          # (s) 差分改正最大时龄
pos2-syncsol       =off        # (0:off,1:on) 是否同步输出流动站和基站解
pos2-slipthres     =0.1        # (m) 周跳检测阈值
pos2-dopthres      =10         # (m) 多普勒观测残差阈值
pos2-rejionno      =10         # (m) 电离层改正残差剔除阈值
pos2-rejcode       =20         # (m) 伪距残差剔除阈值
pos2-rejdop        =2          # (m) 多普勒残差剔除阈值
pos2-rejgdop       =30         # GDOP 剔除阈值
pos2-niter         =1          # 每历元滤波迭代次数
pos2-baselen       =0          # (m) 已知基线长度，0 表示不约束
pos2-basesig       =0          # (m) 基线长度约束标准差

# -------------------- 输出格式选项 --------------------
out-solformat      =xyz        # (0:llh,1:xyz,2:enu,3:nmea) 输出坐标格式，这里为 ECEF XYZ
out-outhead        =on         # (0:off,1:on) 输出文件包含表头
out-outopt         =on         # (0:off,1:on) 输出文件包含配置选项
out-outvel         =off        # (0:off,1:on) 不输出速度
out-timesys        =gpst       # (0:gpst,1:utc,2:jst) 输出时间系统使用 GPST
out-timeform       =tow        # (0:tow,1:hms) 时间格式使用 GPS 周内秒
out-timendec       =3          # 时间小数位数
out-degform        =deg        # (0:deg,1:dms) 角度格式为十进制度
out-fieldsep       =           # 输出字段分隔符，留空表示默认
out-outsingle      =off        # (0:off,1:on) 不输出单点定位结果
out-maxsolstd      =0          # (m) 最大解标准差限制，0 表示不限制
out-height         =ellipsoidal # (0:ellipsoidal,1:geodetic) 高程输出为椭球高
out-geoid          =internal   # (0:internal,1:egm96,2:egm08_2.5,3:egm08_1,4:gsi2000) 大地水准面模型使用 internal
out-solstatic      =all        # (0:all,1:single) 静态解输出策略
out-nmeaintv1      =0          # (s) NMEA GGA 输出间隔
out-nmeaintv2      =0          # (s) NMEA RMC/GSV 输出间隔
out-outstat        =residual   # (0:off,1:state,2:residual) 输出残差统计信息

# -------------------- 误差模型与随机模型 --------------------
stats-eratio1      =200        # L1 伪距与载波相位误差比
stats-eratio2      =300        # L2 伪距与载波相位误差比
stats-eratio5      =200        # L5 伪距与载波相位误差比
stats-errphase     =0.005      # (m) 载波相位观测基础标准差
stats-errphaseel   =0.000      # (m) 与高度角相关的载波相位误差项
stats-errphasebl   =0          # (m/10km) 与基线长度相关的载波相位误差项
stats-errdoppler   =1          # (Hz) 多普勒观测标准差
stats-snrmax       =45         # (dB.Hz) SNR 上限，用于误差建模
stats-errsnr       =0.005      # (m) 与 SNR 相关的误差项
stats-errrcv       =0          # ( ) 接收机相关误差项
stats-stdbias      =30         # (m) 初始偏差标准差
stats-stdiono      =0.03       # (m) 电离层状态初始标准差
stats-stdtrop      =0.3        # (m) 对流层状态初始标准差
stats-prnaccelh    =1.5        # (m/s^2) 水平加速度过程噪声
stats-prnaccelv    =0.1        # (m/s^2) 垂向加速度过程噪声
stats-prnbias      =0.001      # (m) 模糊度偏差过程噪声
stats-prniono      =0.01       # (m) 电离层过程噪声
stats-prntrop      =0.001      # (m) 对流层过程噪声
stats-prnpos       =0          # (m) 位置状态过程噪声
stats-clkstab      =0          # (s/s) 接收机时钟稳定度

# -------------------- 天线与测站设置 --------------------
ant1-postype       =llh        # (0:llh,1:xyz,2:single,3:posfile,4:rinexhead,5:rtcm,6:raw) 流动站坐标类型，这里使用经纬高
ant1-pos1          =0          # (deg|m) 流动站位置参数 1
ant1-pos2          =0          # (deg|m) 流动站位置参数 2
ant1-pos3          =0          # (m|m) 流动站位置参数 3
ant1-anttype       =           # 流动站天线型号，留空
ant1-antdele       =0          # (m) 流动站天线东向偏移
ant1-antdeln       =0          # (m) 流动站天线北向偏移
ant1-antdelu       =0          # (m) 流动站天线天向偏移
ant2-postype       =xyz        # (0:llh,1:xyz,2:single,3:posfile,4:rinexhead,5:rtcm,6:raw) 基站坐标类型，这里使用 ECEF XYZ
ant2-pos1          =-2267208.9283 # (deg|m) 基站 X 坐标
ant2-pos2          =5009582.9268 # (deg|m) 基站 Y 坐标
ant2-pos3          =3221142.2773 # (m|m) 基站 Z 坐标
ant2-anttype       =           # 基站天线型号，留空
ant2-antdele       =0          # (m) 基站天线东向偏移
ant2-antdeln       =0          # (m) 基站天线北向偏移
ant2-antdelu       =0          # (m) 基站天线天向偏移
ant2-maxaveep      =1          # 基站坐标平均使用的最大历元数
ant2-initrst       =on         # (0:off,1:on) 初始化时重置基站相关状态

# -------------------- 杂项与辅助文件 --------------------
misc-timeinterp    =off        # (0:off,1:on) 不进行时间插值
misc-sbasatsel     =0          # (0:all) SBAS 卫星选择，0 表示全部
misc-rnxopt1       =           # RINEX 输入选项 1，留空
misc-rnxopt2       =           # RINEX 输入选项 2，留空
misc-pppopt        =           # PPP 扩展选项，留空
file-satantfile    =           # 卫星天线相位中心文件路径
file-rcvantfile    =           # 接收机天线文件路径
file-staposfile    =           # 测站坐标文件路径
